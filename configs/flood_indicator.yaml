# Flood indicator (icon on the web map) — chỉ báo dựa trên lượng mưa tích lũy.
# NOT a flood probability and NOT a FLOOD / NO FLOOD prediction. Absence of an icon is not "no flood".
# User decision 2026-11-19 (binding): one variable, the rolling 6-hour rain accumulation at a cell (A6h, mm).
#   A6h < a                → no icon
#   a <= A6h < b           → "Có thể ngập"       (yellow "!")
#   A6h >= b               → "Nguy cơ ngập cao"  (red "!")
#   A24h >= long_rule.mm   → at least the red level
# a, b and the 150 mm rule are GAUGE-SCALE (rain amounts quoted from gauges in the evidence).
# The agent never changes a, b or the long rule. `satellite_proposal` (ratio-based, U1.7) is REJECTED
# (user decision U1-D1, 2026-11-20); GSMaP proposals live in `gsmap_now_thresholds` (NEEDS_REVIEW).
#
# Evidence behind the decision (U0 documents):
#   - KTTV warning 23/7/2024 03h45: 20–50 mm in 3 h, locally > 70 mm, street-flood warning (Tổng cục KTTV, NGLU-16)
#   - 28/9/2023: Hoàng Mai 105 mm in 6 h (0h–6h), water up to 0.7 m (VnExpress International)
#   - 24/7/2024: 150–300 mm, deep flooding from night to morning (Tuổi Trẻ)
#   - 26/8/2025 (Kajiki): up to 270 mm by 6:00 (Tuổi Trẻ News)
#   - 30/9/2025 (Bualoi): commonly 250–350 mm, Ô Chợ Dừa 527 mm, about 116 flood points (Nhân Dân, VOV)
#   - Drainage design capacity 310 mm / 2 days (Sở Xây dựng Hà Nội; Thanh Tra, Nhân Dân)
#   - Yagi morning 7/9/2024: 15–42 mm without reported inner-city flooding (Báo Đấu Thầu)

variable: A6h
a_mm: 50
b_mm: 100
long_rule: {window_h: 24, mm: 150, level: high}
scale: gauge
satellite_factor: null
status: provisional
decided: 2026-11-19
levels:
  none: {icon: null}
  possible: {icon: "!", colour: yellow, label_vi: "Có thể ngập"}
  high: {icon: "!", colour: red, label_vi: "Nguy cơ ngập cao"}
history_mode: observed rain only — A6h / A24h over the past 6 h / 24 h ending at the time of interest
serving_mode_P5: "A6h(t) = observed (t-5h, t] + nowcast (t, t+1h]; documented only, not implemented in U1"
wording: "chỉ báo dựa trên lượng mưa tích lũy"

# --- product_thresholds (user decision U1-D1, 2026-11-20) -------------------------------------------
# IMERG Final / Late: the gauge-scale thresholds are used directly (factor 1.0). Basis: REPORT_U1 §13.5 —
# 12.2 % (Final) / 14.8 % (Late) of rainy-season days with an icon, 2.3 % / 3.1 % with red, and a signal on
# 28/9/2023, 24/7/2024 and 30/9/2025. Chỉ báo dựa trên lượng mưa tích lũy; not a flood probability.
product_thresholds:
  imerg_final: {label: "IMERG Final V07", a_mm: 50, b_mm: 100, long_mm: 150, satellite_factor: 1.0, status: provisional, decided: 2026-11-20, decision: U1-D1, basis: "REPORT_U1 §13.5"}
  imerg_late: {label: "IMERG Late V07", a_mm: 50, b_mm: 100, long_mm: 150, satellite_factor: 1.0, status: provisional, decided: 2026-11-20, decision: U1-D1, basis: "REPORT_U1 §13.5"}
  # user decision U1-D2 (2026-11-20): GSMaP NOW GC uses its own scale (b = 2a, A24h threshold independent of a);
  # 9/10 reference days caught, 11.6 % / 4.9 % of 2024–2025 rainy-season days with an icon / red (REPORT_U1 §16.2).
  gsmap_now_gc: {label: "GSMaP NOW rain_rate_gc_mm_h", a_mm: 110, b_mm: 220, long_mm: 270, status: provisional, decided: 2026-11-20, decision: U1-D2, basis: "REPORT_U1 §16.2 rank 1"}
  gsmap_now: {label: "GSMaP NOW rain_rate_mm_h", status: not_used_for_icon, decided: 2026-11-20, decision: U1-D2, reason: "best load-feasible setting catches 6/10 reference days"}

