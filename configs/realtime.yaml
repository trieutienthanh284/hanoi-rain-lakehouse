# Phase 3A — continuous ingestion (GitHub Actions). Read by src/realtime/*.
# Credentials are NOT here: they come from environment variables only
# (GitHub Secrets in CI; .env loaded at runtime locally).
version: "1.0"

remote:
  bucket_env: "R2_BUCKET"
  realtime_prefix: "lake/v1/realtime/"
  status_prefix: "lake/v1/status/"
  # The only object that may be overwritten (status snapshot). Everything else is put-if-absent.
  overwritable_keys:
    - "lake/v1/status/freshness.json"

workdir:
  # Local working copy. On GitHub runners $RUNNER_TEMP is used instead (ephemeral).
  local_default: "data/_ci_test/work"

sources:
  gsmap_now:
    data_time_field: "window_end_utc"
    stale_after_minutes: 120
    lookback_days: 2           # manifest partitions scanned by the freshness monitor
  openmeteo:
    # Age is measured from the time Open-Meteo made the run available (metadata), not from the
    # initialisation time: ECMWF IFS runs appear ~7.3 h after init, so an issue-time age legitimately
    # reaches ~13.3 h before the next run and a 12 h issue-time rule would raise false alarms (D27).
    data_time_field: "model_availability_time_utc"
    stale_after_minutes: 720
    lookback_days: 2
  imerg_late:
    data_time_field: "window_end_utc"
    stale_after_minutes: 2880
    lookback_days: 5

gsmap_now:
  latest_directory: "/now/latest"   # same value as configs/gsmap_now.yaml access.latest_directory
  max_files_per_run: 60             # rolling ~24 h listing holds 48 rain windows

imerg_late:
  lookback_days: 7          # candidate days: yesterday back to 7 days ago
  max_days_per_run: 2       # newest complete missing days first
  expected_granules: 48
  label_status: "provisional"   # IMERG Late is superseded by IMERG Final later

compaction:
  lookback_days: 3
  min_hours_after_day_end: 1    # last window (23:30-00:30) is ingested at ~00:37

openmeteo:
  api: "https://api.open-meteo.com/v1/forecast"
  metadata_endpoint: "https://api.open-meteo.com/data/{meta_model}/static/meta.json"
  variable: "precipitation"
  forecast_days: 3
  user_agent: "hanoi-flood-lakehouse-research/0.1 (non-commercial thesis prototype)"
  license: "CC BY 4.0, Weather data by Open-Meteo.com"
  models:
    gfs_global:
      # Open-Meteo "GFS Global" blends NCEP GFS 0.11/0.13 deg and 0.25 deg; the issue time is
      # recorded as the newest initialisation of the components (upper bound).
      meta_models: ["ncep_gfs013", "ncep_gfs025"]
    ecmwf_ifs025:
      meta_models: ["ecmwf_ifs025"]
  # 81 points = 47 city pixels + 34 buffer pixels on the 0.5 deg sub-grid (D19),
