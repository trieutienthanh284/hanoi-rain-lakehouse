name: train
# P4C — cloud training of the PILOT rainfall nowcast (manual start only; see docs/agent_runs/RUNBOOK_CLOUD_TRAINING.md).
# Inputs come from R2 (lake/v1/data/gold/..., lake/v1/models/...); outputs go to R2 under lake/v1/runs/<job>/<run_id>/
# and to a 7-day artifact. Re-running the same job resumes: units with a done marker in R2 are skipped.
# Secrets are referenced by name only and passed as environment variables to one step; GitHub masks them in logs
# and the code redacts them as well (src/realtime/common.py). Never echo them.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "p4a6 | p4a7 | p4b_smoke | p4b (v1; final only with final=true) | p4b_post (no training) | p4d_smoke (P4D check, minutes) | p4d (v2 cut vs weight, LOSO OOF; stops at COMPARE_DONE) | p4e_smoke (P4E check, every code path of p4e, minutes) | p4e (v2 challenger P4E.2-P4E.4 + P4E.6, full data; stops at COMPARE_DONE) | nwpconv_backfill (P4G.1 GFS CAPE / LI previous_day1, part 1/1 only) | p4fg_smoke (P4F/P4G check, minutes) | p4fg (final round P4G.0-P4G.5; stops at COMPARE_DONE + SELECTION) | p4fg_final (final fit + REPLAY; refuses without SELECTION.json)"
        required: true
        type: choice
        options: [p4a6, p4a7, p4b_smoke, p4b, p4b_post, p4d_smoke, p4d, p4e_smoke, p4e, nwpconv_backfill, p4fg_smoke, p4fg, p4fg_final]
      part:
        description: "i/n — split the units across parallel runs (1/1 = all)"
        required: true
        default: "1/1"
        type: string
      final:
        description: "p4b only: run the P4B.6 final test (refused unless the user approved it in OOF_DONE.json)"
        required: true
        default: false
        type: boolean
      race_drill:
        description: "p4b_smoke: re-run its gates and final unit, each must be skipped; p4e_smoke / p4fg_smoke: two contenders commit the same gate at once, exactly one writer (race-fix checks)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: train-${{ inputs.job }}-${{ inputs.part }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-train.txt
      - name: Offline tests of the training entry point
        env:
          HFL_P2B_EXCLUDE_SOURCES: imerg_late
        run: |
          python -m pytest -q tests/test_cloud_train.py tests/test_metrics_pilot.py
          if [ "${{ inputs.job }}" = "p4b" ] || [ "${{ inputs.job }}" = "p4b_smoke" ] || [ "${{ inputs.job }}" = "p4b_post" ]; then
            python -m pytest -q tests/test_p4b_job.py tests/test_p4b_race.py tests/test_features_v1.py tests/test_p4b_gold_synthetic.py tests/test_p4b_select_synthetic.py
          fi
          if [ "${{ inputs.job }}" = "p4b_post" ]; then
            python -m pytest -q tests/test_p4b_post.py
          fi
          if [ "${{ inputs.job }}" = "p4d" ] || [ "${{ inputs.job }}" = "p4d_smoke" ]; then
            python -m pytest -q tests/test_p4b_race.py tests/test_features_v1.py tests/test_p4d_job.py tests/test_p4d_gold_synthetic.py tests/test_p4d_fit_synthetic.py
          fi
          if [ "${{ inputs.job }}" = "p4e_smoke" ] || [ "${{ inputs.job }}" = "p4e" ]; then
            python -m pytest -q tests/test_features_v1.py tests/test_p4e_race.py tests/test_p4e_job.py tests/test_p4e_figs.py tests/test_p4e_fit_synthetic.py
          fi
          if [ "${{ inputs.job }}" = "p4fg_smoke" ] || [ "${{ inputs.job }}" = "p4fg" ] || [ "${{ inputs.job }}" = "p4fg_final" ] || [ "${{ inputs.job }}" = "nwpconv_backfill" ]; then
            python -m pytest -q tests/test_rss_gate.py tests/test_p4fg_rules.py tests/test_p4fg_job.py tests/test_nwpconv_backfill.py tests/test_predict_v2_candidate.py tests/test_p4fg_fit_synthetic.py
          fi
      - name: Train
        id: train
        env:
          PYTHONUNBUFFERED: "1"
          # pilot jobs keep the P4A guard; P4B / P4D read IMERG Late (October 2025 labels; Late backfill finished 2026-11-19)
          HFL_P2B_EXCLUDE_SOURCES: ${{ (inputs.job == 'p4b' || inputs.job == 'p4b_smoke' || inputs.job == 'p4b_post' || inputs.job == 'p4d' || inputs.job == 'p4d_smoke' || inputs.job == 'p4e_smoke' || inputs.job == 'p4e' || inputs.job == 'p4fg_smoke' || inputs.job == 'p4fg' || inputs.job == 'p4fg_final' || inputs.job == 'nwpconv_backfill') && 'none' || 'imerg_late' }}
          JOB: ${{ inputs.job }}
          PART: ${{ inputs.part }}
          FINAL: ${{ inputs.final }}
          RACE_DRILL: ${{ inputs.race_drill }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          GSMAP_FTP_HOST: ${{ secrets.GSMAP_FTP_HOST }}
          GSMAP_FTP_USER: ${{ secrets.GSMAP_FTP_USER }}
          GSMAP_FTP_PASSWORD: ${{ secrets.GSMAP_FTP_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          # the step summary of this run is written by cloud_train to this file; never show an older one
          rm -f "cloud_out/step_summary_${JOB}.md"
          extra=()
          if [ "$FINAL" = "true" ]; then extra+=(--final); fi
          if [ "$RACE_DRILL" = "true" ]; then extra+=(--race-drill); fi
          # parallel parts of p4b / p4b_smoke wait for each other at every stage (polling R2 markers once a minute)
          if [ "$JOB" = "p4b" ] || [ "$JOB" = "p4b_smoke" ]; then extra+=(--wait-minutes 120); fi
          # p4d parts wait for each other at every stage (gates, the large stage 5); p4d refuses final / race_drill
          if [ "$JOB" = "p4d" ] || [ "$JOB" = "p4d_smoke" ]; then extra+=(--wait-minutes 150); fi
          # p4e: parts wait up to 150 min for the opening gates (preflight, feat, g2), then only 5 min for the closing
          # gates (cmp, compare-done): a part with no work left exits (single writer per output, D188 fix)
          # p4e: units are assigned to the parts by LPT on the D191 estimate (all parts must use the same n)
          if [ "$JOB" = "p4e_smoke" ] || [ "$JOB" = "p4e" ]; then extra+=(--wait-minutes 150); fi
          # p4fg: parts wait up to 150 min for the opening gates and for hp-select, then 5 min for the closing gates
          if [ "$JOB" = "p4fg_smoke" ] || [ "$JOB" = "p4fg" ] || [ "$JOB" = "p4fg_final" ]; then extra+=(--wait-minutes 150); fi
          python -m src.models.cloud_train --job "$JOB" --part "$PART" --max-minutes 320 "${extra[@]}"
      - name: Step summary
        if: always()
        env:
          JOB: ${{ inputs.job }}
          PART: ${{ inputs.part }}
          OUTCOME: ${{ steps.train.outcome }}
        run: |
          f="cloud_out/step_summary_${JOB}.md"
          if [ "$OUTCOME" = "success" ] && [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### train \`${JOB}\` part \`${PART}\`: Train step ${OUTCOME:-not run}, no summary (see the Train log)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep outputs as artifact (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-${{ inputs.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud_out/
          retention-days: 7
          if-no-files-found: ignore
