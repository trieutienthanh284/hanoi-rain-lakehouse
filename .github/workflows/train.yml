name: train
# P4C — cloud training of the PILOT rainfall nowcast (manual start only; see docs/agent_runs/RUNBOOK_CLOUD_TRAINING.md).
# Inputs come from R2 (lake/v1/data/gold/..., lake/v1/models/...); outputs go to R2 under lake/v1/runs/<job>/<run_id>/
# and to a 7-day artifact. Re-running the same job resumes: units with a done marker in R2 are skipped.
# Secrets are referenced by name only and passed as environment variables to one step; GitHub masks them in logs
# and the code redacts them as well (src/realtime/common.py). Never echo them.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "p4a6 | p4a7 | p4b_smoke (P4B real-data smoke, first) | p4b (v1: Gold, CV, grid, OOF; final only with final=true)"
        required: true
        type: choice
        options: [p4a6, p4a7, p4b_smoke, p4b]
      part:
        description: "i/n — split the units across parallel runs (1/1 = all)"
        required: true
        default: "1/1"
        type: string
      final:
        description: "p4b only: run the P4B.6 final test (refused unless the user approved it in OOF_DONE.json)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: train-${{ inputs.job }}-${{ inputs.part }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-train.txt
      - name: Offline tests of the training entry point
        env:
          HFL_P2B_EXCLUDE_SOURCES: imerg_late
        run: |
          python -m pytest -q tests/test_cloud_train.py tests/test_metrics_pilot.py
          if [ "${{ inputs.job }}" = "p4b" ] || [ "${{ inputs.job }}" = "p4b_smoke" ]; then
            python -m pytest -q tests/test_p4b_job.py tests/test_features_v1.py tests/test_p4b_gold_synthetic.py tests/test_p4b_select_synthetic.py
          fi
      - name: Train
        env:
          PYTHONUNBUFFERED: "1"
          # pilot jobs keep the P4A guard; P4B reads IMERG Late (October 2025 labels; Late backfill finished 2026-11-19)
          HFL_P2B_EXCLUDE_SOURCES: ${{ (inputs.job == 'p4b' || inputs.job == 'p4b_smoke') && 'none' || 'imerg_late' }}
          JOB: ${{ inputs.job }}
          PART: ${{ inputs.part }}
          FINAL: ${{ inputs.final }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          GSMAP_FTP_HOST: ${{ secrets.GSMAP_FTP_HOST }}
          GSMAP_FTP_USER: ${{ secrets.GSMAP_FTP_USER }}
          GSMAP_FTP_PASSWORD: ${{ secrets.GSMAP_FTP_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$FINAL" = "true" ]; then extra+=(--final); fi
          # parallel parts of p4b wait for each other at every stage (polling R2 markers once a minute)
          if [ "$JOB" = "p4b" ]; then extra+=(--wait-minutes 120); fi
          python -m src.models.cloud_train --job "$JOB" --part "$PART" --max-minutes 320 "${extra[@]}"
      - name: Keep outputs as artifact (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-${{ inputs.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud_out/
          retention-days: 7
          if-no-files-found: ignore
